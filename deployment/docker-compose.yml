services:
  app:
    image: works-suite-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "8080"
      ConnectionStrings__DefaultConnection: Data Source=/app/data/bulk-email-sender.db;Cache=Shared;Default Timeout=30
      DataProtection__KeysPath: /app/data/keys
      GoogleOAuth__ClientId: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GoogleOAuth__ClientSecret: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      GoogleOAuth__RedirectUri: ${GOOGLE_REDIRECT_URI:?Set GOOGLE_REDIRECT_URI in .env}
      GoogleOAuth__AngularReturnUri: ${APP_URL:?Set APP_URL in .env}/
      AppAuth__PasswordHash: ${APP_PASSWORD_HASH:?Set APP_PASSWORD_HASH in .env}
    volumes:
      - ./data:/app/data
    networks:
      private: {}
      egress:
        gw_priority: 1
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [private]

networks:
  private:
    driver: bridge
    internal: true
  egress:
    driver: bridge
