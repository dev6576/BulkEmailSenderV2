<div class="recipient-input">

  <div class="recipient-header">

    <div>
      <h2>Recipients</h2>

      <p>
        Add recipients manually or import them from a CSV, XLS, or XLSX file.
      </p>
    </div>


    <div class="header-actions">


      <button
        type="button"
        class="secondary-button"
        [disabled]="isValidating() || gridRows.length === 0"
        (click)="validateRows()">

        @if (isValidating()) {
          Validating...
        }
        @else {
          Validate Rows
        }

      </button>


      <button
        type="button"
        class="secondary-button"
        (click)="addRow()">
        Add Row
      </button>


      <button
        type="button"
        class="secondary-button"
        (click)="openAddColumn()">
        Add Column
      </button>


      <button
        type="button"
        class="secondary-button"
        (click)="previewFirstRow()">
        Preview
      </button>


      <label class="file-button">

        Import File

        <input
          type="file"
          accept=".csv,.xls,.xlsx"
          (change)="onCsvSelected($event)" />

      </label>

    </div>

  </div>


  <!-- =====================================================
       ADD COLUMN INPUT
       ===================================================== -->

  @if (showAddColumnInput) {

    <div class="add-column-panel">

      <input
        type="text"
        class="column-name-input"
        placeholder="New column name"
        [(ngModel)]="newColumnName"
        (keyup.enter)="addColumn()" />


      <button
        type="button"
        class="secondary-button"
        (click)="addColumn()">
        Add
      </button>


      <button
        type="button"
        class="secondary-button"
        (click)="cancelAddColumn()">
        Cancel
      </button>

    </div>

  }


  <!-- =====================================================
       VALIDATION SUMMARY
       ===================================================== -->

  @if (validationSummary) {

    <div class="validation-summary" [class.has-errors]="validationErrors.length > 0" role="status">

      <strong>{{ validationSummary }}</strong>

    </div>

  }


  <!-- =====================================================
       GRID
       ===================================================== -->

  <div class="grid-container" [style.height.px]="gridViewportHeight">

    <ag-grid-angular
      class="recipient-grid"
      [theme]="theme"
      [rowData]="gridRows"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowSelection]="rowSelection"
      [selectionColumnDef]="selectionColumnDef"
      [getRowId]="getRowId"
      (gridReady)="onGridReady($event)"
      (selectionChanged)="onSelectionChanged()"
      (cellValueChanged)="onCellValueChanged($event)">
    </ag-grid-angular>

  </div>


  <!-- =====================================================
       VALIDATION
       ===================================================== -->

  <div class="recipient-footer">


    @if (isImportingCsv) {

      <span class="import-status">
        Importing...
      </span>

    }

  </div>

</div>
