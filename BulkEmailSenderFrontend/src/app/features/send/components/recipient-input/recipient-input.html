<div class="recipient-input">

  <div class="recipient-toolbar">

    <button
      type="button"
      class="primary-button"
      (click)="addRow()">
      Add Row
    </button>

    <label class="secondary-button csv-button">
      Import CSV
      <input
        type="file"
        accept=".csv"
        hidden
        (change)="onCsvSelected($event)" />
    </label>

    <button
      type="button"
      class="secondary-button"
      (click)="openAddColumn()">
      Add Column
    </button>

  </div>

  @if (showAddColumnInput) {

    <div class="add-column-panel">

      <input
        type="text"
        class="column-name-input"
        placeholder="Column name"
        [value]="newColumnName"
        (input)="newColumnName = $any($event.target).value"
        (keydown.enter)="confirmAddColumn()"
        (keydown.escape)="cancelAddColumn()" />

      <button
        type="button"
        class="primary-button"
        (click)="confirmAddColumn()">
        Add
      </button>

      <button
        type="button"
        class="secondary-button"
        (click)="cancelAddColumn()">
        Cancel
      </button>

    </div>
  }

  <div class="grid-container">

    <ag-grid-angular
      class="recipient-grid"
      [theme]="theme"
      [rowData]="gridRows"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged($event)">
    </ag-grid-angular>

  </div>

</div>
